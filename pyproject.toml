[project]
name = "mathmodel-ai"
version = "0.1.0"
description = "End-to-end AI automation system for mathematical modeling competitions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "MathModel AI Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
    "openai>=1.58.0",
    "google-generativeai>=0.8.0",
    "anthropic>=0.42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.20.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "asyncio: async test marker",
    "integration: integration test",
    "postgresql: requires PostgreSQL",
]

[tool.setuptools.packages.find]
where = ["src"]